name: Bare Autofill LSPosed APK

on:
  push:
    branches:
      - feature/bare-autofill-lsposed
    paths:
      - lsposed-autofill/**
      - .github/workflows/bare-autofill-lsposed.yml
  pull_request:
    paths:
      - lsposed-autofill/**
      - .github/workflows/bare-autofill-lsposed.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android 35 build packages from the runner SDK
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests and unsigned-source debug build
        working-directory: lsposed-autofill
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and hash APK
        run: |
          set -euo pipefail
          apk=lsposed-autofill/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          test "$(unzip -p "$apk" assets/xposed_init)" = "dev.rollingbeans.bareautofill.BareAutofillHook"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='dev.rollingbeans.bareautofill'"
          sha256sum "$apk" | tee bare-autofill-lsposed.sha256

      - name: Upload test APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: bare-autofill-lsposed-${{ github.run_number }}
          path: |
            lsposed-autofill/app/build/outputs/apk/debug/app-debug.apk
            bare-autofill-lsposed.sha256
          retention-days: 14
          if-no-files-found: error
